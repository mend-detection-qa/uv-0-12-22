[project]
name = "core"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.32.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "coverage>=7.6.10",
]
docs = [
    "mkdocs>=1.6.1",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
