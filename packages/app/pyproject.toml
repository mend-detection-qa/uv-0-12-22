[project]
name = "app"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "click>=8.1.8",
    "core",
]

[dependency-groups]
test = [
    "pytest>=8.3.5",
]

[tool.uv]
default-groups = ["test"]

[tool.uv.sources]
core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
